<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - AutoCare Rodriguez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .saving-indicator::after { content: '...'; display: inline-block; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-gray-800 text-white px-6 py-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">Panel Admin - AutoCare Rodriguez</h1>
            <div class="flex items-center space-x-4">
                <a href="#"><button class="px-4 py-2 rounded hover:bg-gray-700">Clientes</button></a>
                <a href="admin.html"><button class="px-4 py-2 rounded bg-gray-700">Citas</button></a>
                <a href="#"><button class="px-4 py-2 rounded hover:bg-gray-700">Inventario</button></a>
                <a href="#"><button class="px-4 py-2 rounded hover:bg-gray-700">Facturación</button></a>
                <a href="#"><button class="px-4 py-2 rounded hover:bg-gray-700">Usuarios Admin</button></a>
                </div>
        </div>
    </nav>

    <div id="adminView" class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-semibold text-gray-800">Gestión de Citas</h2>
            <button id="open-admin-schedule-modal-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                Agregar Nueva Cita
            </button>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
             <h3 class="text-xl font-semibold mb-4">Filtrar Citas</h3>
            <form id="filter-form" class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-1">
                     <label for="filter-date" class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                    <input type="date" id="filter-date" name="filter_date" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                 <div class="flex-1">
                     <label for="filter-client" class="block text-sm font-medium text-gray-700 mb-1">Cliente (Nombre o Email)</label>
                    <input type="text" id="filter-client" name="filter_client" placeholder="Buscar..." class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                 </div>
                 <div class="flex-1">
                     <label for="filter-status" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                    <select id="filter-status" name="filter_status" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Todos</option>
                        <option value="pending">Pendiente</option>
                        <option value="in_progress">En Progreso</option>
                        <option value="completed">Completado</option>
                        <option value="cancelled">Cancelado</option>
                    </select>
                </div>
                <button type="button" id="filter-btn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 h-10">Filtrar</button>
                <button type="button" id="clear-filter-btn" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 h-10">Limpiar</button>
            </form>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-xl font-semibold mb-4">Listado de Citas</h3>
             <div id="api-error-message" class="mb-4 p-3 text-red-700 bg-red-100 border border-red-400 rounded hidden"></div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha y Hora</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cliente</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Vehículo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Servicio</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Estado</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="appointments-table-body" class="bg-white divide-y divide-gray-200">
                        <tr id="loading-row">
                            <td colspan="6" class="text-center py-4 text-gray-500">Cargando citas...</td>
                        </tr>
                        </tbody>
                </table>
            </div>
             <div id="no-results" class="text-center py-4 text-gray-500 hidden">No se encontraron citas con los filtros aplicados.</div>
        </div>
    </div>

    <div id="adminScheduleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 overflow-y-auto p-4">
         <div class="bg-white rounded-lg p-8 max-w-2xl w-full m-auto">
             <div class="flex justify-between items-center mb-6">
                <h3 id="admin-modal-title" class="text-2xl font-semibold">Agregar Nueva Cita</h3>
                <button id="close-admin-schedule-modal-btn" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="admin-schedule-form" class="space-y-6">
                <input type="hidden" id="a-appointment-id" name="appointmentId">
                <input type="hidden" id="a-user-id" name="userId"> <div>
                    <label for="a-cliente" class="block text-sm font-medium text-gray-700 mb-1">Cliente (Nombre o Email)</label>
                    <input type="text" id="a-cliente" name="clientIdentifier" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Nombre completo o Email del cliente...">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="a-fecha" class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                        <input type="date" id="a-fecha" name="appointmentDate" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="a-hora" class="block text-sm font-medium text-gray-700 mb-1">Hora</label>
                        <input type="time" id="a-hora" name="appointmentTime" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label for="a-vehiculo" class="block text-sm font-medium text-gray-700 mb-1">Descripción del Vehículo</label>
                    <input type="text" id="a-vehiculo" name="vehicleDescription" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Ej: Toyota Camry 2020 Azul">
                </div>
                <div>
                    <label for="a-servicio" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Servicio</label>
                    <select id="a-servicio" name="serviceType" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Seleccione Servicio</option>
                        <option value="oil_change">Cambio de Aceite</option>
                        <option value="tire_rotation">Rotación de Llantas</option>
                        <option value="brake_service">Servicio de Frenos</option>
                        <option value="diagnostico">Diagnóstico General</option>
                        <option value="otro">Otro (detallar en notas)</option>
                    </select>
                </div>
                 <div>
                    <label for="a-status" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                    <select id="a-status" name="status" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="pending">Pendiente</option>
                        <option value="in_progress">En Progreso</option>
                        <option value="completed">Completado</option>
                        <option value="cancelled">Cancelado</option>
                    </select>
                </div>
                <div>
                    <label for="a-notas" class="block text-sm font-medium text-gray-700 mb-1">Notas Adicionales (Admin)</label>
                    <textarea id="a-notas" name="notes" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500" rows="3"></textarea>
                </div>
                <div id="admin-schedule-form-feedback" class="text-red-600 text-sm mt-2"></div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-admin-schedule-btn" class="px-6 py-2 border rounded-lg hover:bg-gray-100">Cancelar</button>
                    <button type="button" id="submit-admin-schedule-btn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Guardar Cita
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-gray-800 text-white py-6 px-6 mt-8">
        <div class="container mx-auto text-center">
             <p>&copy; <span id="current-year-admin"></span> AutoCare Rodriguez. Todos los derechos reservados.</p>
        </div>
    </footer>

     <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Configuración ---
            const API_BASE_URL = 'http://localhost:3000'; // Ajusta si tu API corre en otro puerto/host

            // --- Elements ---
            const adminScheduleModal = document.getElementById('adminScheduleModal');
            const openAdminModalBtn = document.getElementById('open-admin-schedule-modal-btn');
            const closeAdminModalBtn = document.getElementById('close-admin-schedule-modal-btn');
            const cancelAdminModalBtn = document.getElementById('cancel-admin-schedule-btn');
            const adminScheduleForm = document.getElementById('admin-schedule-form');
            const submitAdminScheduleBtn = document.getElementById('submit-admin-schedule-btn');
            const adminFeedbackDiv = document.getElementById('admin-schedule-form-feedback');
            const appointmentsTableBody = document.getElementById('appointments-table-body');
            const loadingRow = document.getElementById('loading-row');
            const noResultsDiv = document.getElementById('no-results');
            const filterForm = document.getElementById('filter-form');
            const filterBtn = document.getElementById('filter-btn');
            const clearFilterBtn = document.getElementById('clear-filter-btn');
            const adminModalTitle = document.getElementById('admin-modal-title');
            const appointmentIdInput = document.getElementById('a-appointment-id');
            const userIdInput = document.getElementById('a-user-id'); // Input oculto para UserID en edición
            const apiErrorMessageDiv = document.getElementById('api-error-message');


            // --- Funciones Auxiliares ---
            function showApiError(message) {
                apiErrorMessageDiv.textContent = `Error API: ${message}`;
                apiErrorMessageDiv.classList.remove('hidden');
            }
            function hideApiError() {
                apiErrorMessageDiv.classList.add('hidden');
                apiErrorMessageDiv.textContent = '';
            }
            // Función genérica para fetch (simplifica añadir headers, manejar errores)
            async function apiFetch(endpoint, options = {}) {
                 // No se añade el header Authorization
                options.headers = {
                    'Content-Type': 'application/json',
                    ...options.headers, // Permite sobreescribir Content-Type si es necesario
                };

                try {
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                    hideApiError(); // Ocultar error previo si la nueva llamada funciona inicialmente

                    if (!response.ok) {
                        let errorData;
                        try {
                            errorData = await response.json(); // Intenta obtener mensaje de error de la API
                        } catch (e) {
                            errorData = { message: response.statusText }; // Usa texto de estado si no hay JSON
                        }
                        console.error(`API Error ${response.status}:`, errorData);
                        showApiError(errorData.message || `Error ${response.status}`);
                        throw new Error(errorData.message || `Error ${response.status}`);
                    }

                    // Si la respuesta es 204 No Content (ej: DELETE exitoso sin cuerpo)
                    if (response.status === 204) {
                        return null; // O un objeto indicando éxito, ej: { success: true }
                    }

                    return await response.json(); // Parsea respuesta JSON normal
                } catch (error) {
                    // Errores de red u otros errores que no son respuestas HTTP
                    if (!apiErrorMessageDiv.textContent) { // No sobrescribir si ya hay un error HTTP
                       console.error('Fetch Error:', error);
                       showApiError(error.message || 'Error de conexión o de red.');
                    }
                    throw error; // Propagar el error para manejo adicional si es necesario
                }
            }

            // --- Modal Handling ---
            const showAdminModal = (isEditMode = false, appointmentData = null) => {
                adminScheduleForm.reset();
                appointmentIdInput.value = '';
                userIdInput.value = ''; // Limpiar UserID oculto
                adminFeedbackDiv.textContent = '';
                hideApiError(); // Ocultar errores de API al abrir modal

                 // Deshabilitar campo cliente en modo edición
                 document.getElementById('a-cliente').disabled = isEditMode;

                if (isEditMode && appointmentData) {
                    adminModalTitle.textContent = 'Editar Cita';
                    appointmentIdInput.value = appointmentData.AppointmentID;
                    userIdInput.value = appointmentData.UserID; // Guardar UserID

                    // Poblar formulario
                    document.getElementById('a-cliente').value = appointmentData.User?.FullName || `Usuario ID: ${appointmentData.UserID}`; // Mostrar nombre o ID
                    const dateTime = new Date(appointmentData.AppointmentDateTime);
                    // Manejo de zona horaria local para inputs date/time
                    const localDate = new Date(dateTime.getTime() - dateTime.getTimezoneOffset() * 60000);
                    document.getElementById('a-fecha').value = localDate.toISOString().split('T')[0];
                    document.getElementById('a-hora').value = localDate.toISOString().split('T')[1].substring(0, 5);
                    document.getElementById('a-vehiculo').value = appointmentData.VehicleDescription;
                    document.getElementById('a-servicio').value = appointmentData.ServiceType;
                    document.getElementById('a-status').value = appointmentData.Status;
                    document.getElementById('a-notas').value = appointmentData.Notes || '';
                } else {
                    adminModalTitle.textContent = 'Agregar Nueva Cita';
                     document.getElementById('a-cliente').disabled = false; // Habilitar campo cliente
                }
                adminScheduleModal.classList.remove('hidden');
            };
            const hideAdminModal = () => {
                 adminScheduleModal.classList.add('hidden');
                 adminFeedbackDiv.textContent = ''; // Limpiar feedback del form al cerrar
            }

            openAdminModalBtn.addEventListener('click', () => showAdminModal(false));
            closeAdminModalBtn.addEventListener('click', hideAdminModal);
            cancelAdminModalBtn.addEventListener('click', hideAdminModal);

            // --- Footer Year ---
            document.getElementById('current-year-admin').textContent = new Date().getFullYear();

            // --- API Interaction ---
            function getFilterParams() {
                const params = new URLSearchParams();
                const date = document.getElementById('filter-date').value;
                const client = document.getElementById('filter-client').value.trim();
                const status = document.getElementById('filter-status').value;
                if (date) params.append('date', date);
                if (client) params.append('client', client);
                if (status) params.append('status', status);
                return params.toString();
            }

            async function loadAllAppointments() {
                loadingRow.style.display = '';
                noResultsDiv.classList.add('hidden');
                appointmentsTableBody.innerHTML = ''; // Limpiar tabla antes de añadir fila de carga
                appointmentsTableBody.appendChild(loadingRow);
                hideApiError(); // Ocultar errores previos

                const filters = getFilterParams();
                const endpoint = `/api/appointments?${filters}`; // Usa la ruta base ahora

                console.log(`Cargando citas desde: ${endpoint}`);

                try {
                    const appointments = await apiFetch(endpoint); // Usa la función apiFetch
                    loadingRow.style.display = 'none';

                    if (appointments && appointments.length > 0) {
                        appointmentsTableBody.innerHTML = ''; // Limpiar completamente antes de añadir filas reales
                        appointments.forEach(renderAppointmentRow);
                    } else {
                        appointmentsTableBody.innerHTML = '';
                        noResultsDiv.classList.remove('hidden');
                    }
                } catch (error) {
                    // El error ya se muestra por apiFetch
                    loadingRow.style.display = 'none';
                    appointmentsTableBody.innerHTML = ''; // Limpiar por si acaso
                    // No necesitamos añadir una fila de error aquí, ya se muestra arriba
                }
            }

            function renderAppointmentRow(appointment) {
                // Formatear fecha/hora localmente
                const localDateTime = new Date(appointment.AppointmentDateTime).toLocaleString('es-MX', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', hour12: true
                });

                 const rowHTML = `
                    <tr class="hover:bg-gray-50 appointment-row" data-appointment-id="${appointment.AppointmentID}" data-user-id="${appointment.UserID}" data-client-name="${appointment.User?.FullName || ''}" data-vehicle="${appointment.VehicleDescription}" data-service="${appointment.ServiceType}" data-datetime="${appointment.AppointmentDateTime}" data-notes="${appointment.Notes || ''}" data-status="${appointment.Status}">
                        <td class="px-6 py-4 whitespace-nowrap appointment-datetime">${localDateTime}</td>
                        <td class="px-6 py-4 whitespace-nowrap appointment-client">${appointment.User?.FullName || `Usuario ID: ${appointment.UserID}`}</td>
                        <td class="px-6 py-4 whitespace-nowrap appointment-vehicle">${appointment.VehicleDescription}</td>
                        <td class="px-6 py-4 whitespace-nowrap appointment-service">${appointment.ServiceType}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <select class="status-select px-2 py-1 border rounded text-sm focus:ring-indigo-500 focus:border-indigo-500" data-original-status="${appointment.Status}">
                                <option value="pending" ${appointment.Status === 'pending' ? 'selected' : ''}>Pendiente</option>
                                <option value="in_progress" ${appointment.Status === 'in_progress' ? 'selected' : ''}>En Progreso</option>
                                <option value="completed" ${appointment.Status === 'completed' ? 'selected' : ''}>Completado</option>
                                <option value="cancelled" ${appointment.Status === 'cancelled' ? 'selected' : ''}>Cancelado</option>
                            </select>
                            <button class="update-status-btn ml-2 text-xs text-green-600 hover:text-green-800" style="display: none;">Guardar</button>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button class="text-indigo-600 hover:text-indigo-900 mr-3 edit-btn">Editar</button>
                            <button class="text-red-600 hover:text-red-900 delete-btn">Eliminar</button>
                        </td>
                    </tr>`;
                appointmentsTableBody.insertAdjacentHTML('beforeend', rowHTML);
            }

            // Listener filtros
            filterBtn.addEventListener('click', loadAllAppointments);
            clearFilterBtn.addEventListener('click', () => {
                filterForm.reset();
                loadAllAppointments();
            });

             // Listener formulario agregar/editar cita
             submitAdminScheduleBtn.addEventListener('click', async () => {
                adminFeedbackDiv.textContent = '';
                hideApiError();
                const formData = new FormData(adminScheduleForm);
                const appointmentId = formData.get('appointmentId');
                const isEditMode = !!appointmentId;

                // Asegurarse que la fecha y hora se combinen correctamente
                 const dateValue = formData.get('appointmentDate');
                 const timeValue = formData.get('appointmentTime');
                 let combinedDateTime = null;
                 if(dateValue && timeValue){
                     // Crear fecha en UTC para evitar problemas de zona horaria al enviar a la API
                     // La API debería interpretarla correctamente
                      const dateObj = new Date(dateValue + 'T' + timeValue + ':00');
                      // Validar si la fecha es válida antes de convertir
                      if (!isNaN(dateObj.getTime())) {
                         combinedDateTime = dateObj.toISOString(); // Enviar en formato ISO 8601 (UTC por defecto)
                      }
                 }


                const data = {
                    // En modo edición, no enviamos clientIdentifier, el ID de usuario ya está asociado
                    // Enviamos clientIdentifier solo si NO estamos en modo edición
                    clientIdentifier: isEditMode ? undefined : formData.get('clientIdentifier'),
                    appointmentDateTime: combinedDateTime,
                    vehicleDescription: formData.get('vehicleDescription'),
                    serviceType: formData.get('serviceType'),
                    status: formData.get('status'),
                    notes: formData.get('notes') || null
                };

                 // Remover clientIdentifier si es undefined (para PUT)
                 if(data.clientIdentifier === undefined) delete data.clientIdentifier;


                 // Validación básica frontal
                 if ((!isEditMode && !data.clientIdentifier) || !data.appointmentDateTime || !data.vehicleDescription || !data.serviceType || !data.status) {
                     adminFeedbackDiv.textContent = 'Por favor, complete todos los campos requeridos (Cliente*, Fecha, Hora, Vehículo, Servicio, Estado). *Cliente requerido solo al crear.';
                     return;
                 }
                 if (!combinedDateTime) {
                     adminFeedbackDiv.textContent = 'Fecha u hora inválida.';
                     return;
                 }


                const endpoint = isEditMode ? `/api/appointments/${appointmentId}` : '/api/appointments';
                const method = isEditMode ? 'PUT' : 'POST';

                console.log(`Enviando datos a ${method} ${endpoint}:`, JSON.stringify(data));
                submitAdminScheduleBtn.disabled = true;
                submitAdminScheduleBtn.classList.add('saving-indicator');
                submitAdminScheduleBtn.textContent = 'Guardando';

                try {
                    const result = await apiFetch(endpoint, {
                        method: method,
                        body: JSON.stringify(data)
                    });
                    console.log(`Cita ${isEditMode ? 'actualizada' : 'creada'}:`, result);

                    hideAdminModal();
                    loadAllAppointments(); // Recargar tabla
                    alert(`¡Cita ${isEditMode ? 'actualizada' : 'creada'} con éxito!`);

                } catch (error) {
                    // El error ya se muestra por apiFetch en apiErrorMessageDiv o adminFeedbackDiv
                     if (!adminFeedbackDiv.textContent && apiErrorMessageDiv.textContent) {
                         adminFeedbackDiv.textContent = apiErrorMessageDiv.textContent; // Mostrar error específico del form si no hay otro
                     } else if (!adminFeedbackDiv.textContent) {
                         adminFeedbackDiv.textContent = `Error: ${error.message || 'Error desconocido'}`;
                     }
                } finally {
                     submitAdminScheduleBtn.disabled = false;
                     submitAdminScheduleBtn.classList.remove('saving-indicator');
                     submitAdminScheduleBtn.textContent = 'Guardar Cita';
                }
             });


            // Listeners para acciones en la tabla
            appointmentsTableBody.addEventListener('click', async (event) => {
                const target = event.target;
                const row = target.closest('.appointment-row');
                if (!row) return;

                const appointmentId = row.dataset.appointmentId;

                // --- Editar ---
                if (target.classList.contains('edit-btn')) {
                    console.log(`Editar cita ID: ${appointmentId}`);
                    // Reconstruir datos desde atributos data-* de la fila
                    const appointmentData = {
                        AppointmentID: appointmentId,
                        UserID: row.dataset.userId,
                        User: { FullName: row.dataset.clientName },
                        AppointmentDateTime: row.dataset.datetime, // Usar el ISO string original
                        VehicleDescription: row.dataset.vehicle,
                        ServiceType: row.dataset.service,
                        Status: row.dataset.status,
                        Notes: row.dataset.notes,
                    };
                     // Validar que los datos necesarios existen
                    if(appointmentData.AppointmentDateTime && appointmentData.UserID){
                       showAdminModal(true, appointmentData);
                    } else {
                         console.error("Faltan datos en la fila para editar:", row.dataset);
                         alert("Error: No se pudieron cargar los datos completos para editar.");
                    }

                // --- Eliminar ---
                } else if (target.classList.contains('delete-btn')) {
                    console.log(`Eliminar cita ID: ${appointmentId}`);
                     if (confirm(`¿Está seguro que desea eliminar la cita ID ${appointmentId}?`)) {
                         target.disabled = true;
                         target.textContent = 'Eliminando...';
                         hideApiError();

                         try {
                             await apiFetch(`/api/appointments/${appointmentId}`, { method: 'DELETE' });
                             console.log(`Cita ${appointmentId} eliminada.`);
                             row.remove(); // Eliminar fila visualmente
                             alert(`Cita ID ${appointmentId} eliminada.`);
                             if (appointmentsTableBody.children.length === 0 || (appointmentsTableBody.children.length === 1 && appointmentsTableBody.firstChild.id === 'loading-row')) {
                                noResultsDiv.classList.remove('hidden');
                            }
                         } catch (error) {
                             // El error ya se muestra por apiFetch
                             target.disabled = false; // Rehabilitar botón si falla
                             target.textContent = 'Eliminar';
                         }
                     }

                 // --- Guardar Estado ---
                 } else if (target.classList.contains('update-status-btn')) {
                     const selectElement = row.querySelector('.status-select');
                     const newStatus = selectElement.value;
                     console.log(`Actualizar estado cita ID: ${appointmentId} a ${newStatus}`);
                     target.disabled = true;
                     target.classList.add('saving-indicator');
                     target.textContent = 'Guardando'; // El CSS se encarga de los puntos
                     hideApiError();

                     try {
                         const result = await apiFetch(`/api/appointments/${appointmentId}/status`, {
                             method: 'PATCH',
                             body: JSON.stringify({ status: newStatus })
                         });
                         console.log(`Estado actualizado:`, result);
                         selectElement.dataset.originalStatus = newStatus; // Actualizar estado 'original'
                         row.dataset.status = newStatus; // Actualizar data-status de la fila
                         target.style.display = 'none'; // Ocultar botón guardar
                         target.classList.remove('saving-indicator');


                     } catch (error) {
                         // El error ya se muestra por apiFetch
                         selectElement.value = selectElement.dataset.originalStatus; // Revertir select
                          target.disabled = false;
                          target.classList.remove('saving-indicator');
                         target.textContent = 'Guardar';
                         // No ocultar el botón si falló, permitir reintentar
                         target.style.display = 'inline';
                     } finally {
                         // Asegurar que el texto vuelva a la normalidad si no se oculta
                         if(target.style.display !== 'none'){
                              target.textContent = 'Guardar';
                              target.classList.remove('saving-indicator');
                         }
                     }
                 }
            });

            // Listener para cambios en el select de estado
             appointmentsTableBody.addEventListener('change', (event) => {
                 if (event.target.classList.contains('status-select')) {
                     const selectElement = event.target;
                     const saveButton = selectElement.nextElementSibling;
                     if (selectElement.value !== selectElement.dataset.originalStatus) {
                         saveButton.style.display = 'inline';
                         saveButton.disabled = false;
                         saveButton.textContent = 'Guardar';
                         saveButton.classList.remove('saving-indicator');
                     } else {
                         saveButton.style.display = 'none';
                     }
                 }
             });

            // Carga inicial de citas
            loadAllAppointments();
        });
    </script>

</body>
</html>
