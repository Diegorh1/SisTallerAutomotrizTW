              <td class="px-6 py-4">
                <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded-full">Mechanic</span>
              </td>
              <td class="px-6 py-4">
                <span class="px-2 py-1 bg-green-100 text-green-800 rounded-full">Active</span>
              </td>

                  onclick="document.getElementById('editUserModal').classList.remove('hidden')">Edit</button>

      <!-- Modal: Agregar Nuevo Usuario -->
      <!-- Modal: Agregar Nuevo Usuario -->
<div id="addUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white rounded-lg p-8 max-w-md w-full">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-semibold text-gray-800">Agregar Nuevo Usuario</h3>
        <button onclick="document.getElementById('addUserModal').classList.add('hidden')" class="text-gray-500 hover:text-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <!-- Formulario de agregar usuario con ID para JavaScript -->
      <form id="addUserForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input type="text" name="fullName" placeholder="Nombre" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
          <select name="userRole" placeholder="Rol" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            <option value="Administrador">Administrador</option>
            <option value="Mecánico">Mecánico</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
          <select name="userStatus" placeholder="Estado" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>
        <div class="flex justify-end space-x-4 mt-6">
          <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Guardar</button>
        </div>
      </form>
      <script>document.querySelector("#addUserForm").addEventListener("submit", async (event) => {
        event.preventDefault(); // Detiene el envío predeterminado del formulario
    
        // Captura los valores de los campos
        const formData = new FormData(event.target);
        const fullName = formData.get("fullName");
        const userRole = formData.get("userRole");
        const userStatus = formData.get("userStatus");
    
        try {
            // Envía los datos al backend
            const response = await fetch("http://localhost:3000/working-users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fullName, userRole, userStatus }),
            });
    
            if (response.ok) {
                alert("Usuario agregado exitosamente.");
                location.reload(); // Recarga la página para ver los nuevos datos
            } else {
                const errorData = await response.json();
                alert(`Error: ${errorData.message}`);
            }
        } catch (error) {
            console.error("Error al guardar el usuario:", error);
            alert("Hubo un problema al guardar el usuario.");
        }
    });
    </script>
  
    </main>
  </div>
</body>
