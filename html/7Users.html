<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - AutoCare Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="flex h-screen">
    <!-- Contenedor principal -->
    <main class="flex-1 p-8">
      <!-- Encabezado -->
      <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
        <h1 class="text-2xl font-bold text-white">AutoCare Rodriguez</h1>
        <div class="flex items-center space-x-4">
          <div class="flex space-x-4">
            <a href="index.html">
              <button class="px-6 py-2 rounded bg-gray-200 text-gray-800 hover:bg-gray-300">Clients</button>
            </a>
            <a href="/html/2Dates.html">
              <button class="px-6 py-2 rounded bg-gray-200 text-gray-800 hover:bg-gray-300">Appointments</button>
            </a>
            <a href="/html/3.1SegService.html">
              <button class="px-6 py-2 rounded bg-gray-200 text-gray-800 hover:bg-gray-300">SegService</button>
            </a>
            <a href="/html/4Inventory.html">
              <button class="px-6 py-2 rounded bg-gray-200 text-gray-800 hover:bg-gray-300">Inventory</button>
            </a>
            <a href="/html/5Billing.html">
              <button class="px-6 py-2 rounded bg-gray-200 text-gray-800 hover:bg-gray-300">Billing</button>
            </a>
            <a href="/html/7Users.html">
              <button class="px-6 py-2 rounded bg-gray-200 text-gray-800 hover:bg-gray-300">Users</button>
            </a>
          </div>
        </div>
      </div>

      <!-- Botón "Agregar Nuevo Usuario" -->
      <div class="flex justify-between items-center mb-6">
        <button aria-label="Add New User" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700"
          onclick="document.getElementById('addUserModal').classList.remove('hidden')">
          Agregar Nuevo Usuario
        </button>
      </div>

      <!-- Tabla de usuarios -->
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">User</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Email</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Role</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Status</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <!-- Las filas generadas dinámicamente aparecerán aquí -->
          </tbody>
        </table>
      </div>

      <!-- Modal: Agregar Nuevo Usuario -->
      <div id="addUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-8 max-w-md w-full shadow-md">
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-semibold text-gray-800">Agregar Nuevo Usuario</h3>
            <button onclick="document.getElementById('addUserModal').classList.add('hidden')">
                Cancelar
              </button>
              
          </div>

          <!-- Formulario para agregar usuario -->
          <form id="addUserForm" class="space-y-4">
            <div>
              <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
              <input type="text" id="fullName" name="fullName" placeholder="Nombre" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
              <input type="email" id="email" name="email" placeholder="Correo Electrónico" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            </div>

            <div>
              <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
              <input type="password" id="password" name="password" placeholder="Contraseña" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Repite Contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite Contraseña" 
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
        </div>
        
          
            <div>
              <label for="userRole" class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
              <select id="userRole" name="userRole" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                <option value="Administrador">Administrador</option>
                <option value="Mecánico">Mecánico</option>
              </select>
            </div>
            <div>
              <label for="userStatus" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
              <select id="userStatus" name="userStatus" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
            <div class="flex justify-end space-x-4 mt-6">
                <button onclick="document.getElementById('addUserModal').classList.add('hidden')">
                    Cancelar
                  </button>                  
              <button type="submit" 
                      class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 focus:outline-none">
                Guardar
              </button>
              <script>document.querySelector("#addUserForm").addEventListener("submit", async (event) => {
                event.preventDefault(); // Evita que la página se recargue
            
                // Capturar valores del formulario
                const fullName = document.querySelector("#fullName").value;
                const email = document.querySelector("#email").value;
                const userRole = document.querySelector("#userRole").value;
                const userStatus = document.querySelector("#userStatus").value;
            
                try {
                    // Enviar los datos al backend
                    const response = await fetch("http://localhost:3000/working-users", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ fullName, email, userRole, userStatus }),
                    });
            
                    if (response.ok) {
                        alert("Usuario agregado exitosamente.");
                        location.reload(); // Refrescar la página para actualizar los datos
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.message}`);
                    }
                } catch (error) {
                    console.error("Error al guardar el usuario:", error);
                    alert("Hubo un problema al guardar el usuario.");
                }
            });
            </script>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  

<!-- Modal para Editar Usuario -->
 <!-- Modal para Editar Usuario -->
<div id="editUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white rounded-lg p-8 max-w-md w-full shadow-md">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-2xl font-semibold text-gray-800">Editar Usuario</h3>
      <button onclick="document.getElementById('editUserModal').classList.add('hidden')" 
              aria-label="Cerrar modal" 
              class="text-gray-600 hover:text-gray-800">
        ✕
      </button>
    </div>
    <form id="editUserForm" class="space-y-4">
      <input type="hidden" id="editUserId">
      <div>
        <label for="editFullName" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input type="text" id="editFullName" name="editFullName" placeholder="Nombre" 
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
      </div>
      <div>
        <label for="editUserRole" class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
        <select id="editUserRole" name="editUserRole" 
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
          <option value="Administrador">Administrador</option>
          <option value="Mecánico">Mecánico</option>
        </select>
      </div>
      <div>
        <label for="editUserStatus" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
        <select id="editUserStatus" name="editUserStatus" 
                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
          <option value="Activo">Activo</option>
          <option value="Inactivo">Inactivo</option>
        </select>
      </div>
      <div class="flex justify-end space-x-4 mt-6">
        <button type="button" 
                onclick="document.getElementById('editUserModal').classList.add('hidden')" 
                class="px-4 py-2 border rounded-lg hover:bg-gray-100">
          Cancelar
        </button>
        <button type="submit" 
                class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 focus:outline-none">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<script> document.addEventListener("DOMContentLoaded", loadUsers);
</script>

<script>
  document.addEventListener("DOMContentLoaded", loadUsers);

  // Función para cargar usuarios desde el backend
  async function loadUsers() {
    try {
      const response = await fetch("http://localhost:3000/working-users");
      if (!response.ok) throw new Error("Error al obtener los usuarios");

      const users = await response.json();
      const tbody = document.querySelector("tbody");
      // Limpia el contenido previo
      tbody.innerHTML = "";

      if (users.length === 0) {
        const trEmpty = document.createElement("tr");
        const tdEmpty = document.createElement("td");
        tdEmpty.setAttribute("colspan", "5");
        tdEmpty.classList.add("text-center", "py-4", "text-gray-600");
        tdEmpty.textContent = "No hay usuarios disponibles.";
        trEmpty.appendChild(tdEmpty);
        tbody.appendChild(trEmpty);
        return;
      }

      users.forEach((user) => {
        const row = document.createElement("tr");
        row.classList.add("hover:bg-gray-50");
        row.setAttribute("data-id", user.Id);

        // COLUMNA: Nombre (USER)
        const tdName = document.createElement("td");
        tdName.classList.add("px-6", "py-4", "flex", "items-center");
        const spanName = document.createElement("span");
        spanName.classList.add("text-gray-800", "user-name");
        spanName.textContent = user.FullName;
        tdName.appendChild(spanName);
        row.appendChild(tdName);

        // COLUMNA: Email
        const tdEmail = document.createElement("td");
        tdEmail.classList.add("px-6", "py-4", "text-gray-800", "user-email");
        tdEmail.textContent = user.Email;
        row.appendChild(tdEmail);

        // COLUMNA: Rol (UserRole)
        const tdRole = document.createElement("td");
        tdRole.classList.add("px-6", "py-4");
        const spanRole = document.createElement("span");
        spanRole.classList.add(
          "px-2",
          "py-1",
          "bg-purple-100",
          "text-purple-800",
          "rounded-full",
          "user-role"
        );
        spanRole.textContent = user.UserRole;
        tdRole.appendChild(spanRole);
        row.appendChild(tdRole);

        // COLUMNA: Estado (UserStatus)
        const tdStatus = document.createElement("td");
        tdStatus.classList.add("px-6", "py-4");
        const spanStatus = document.createElement("span");
        spanStatus.classList.add(
          "px-2",
          "py-1",
          "bg-green-100",
          "text-green-800",
          "rounded-full",
          "user-status"
        );
        spanStatus.textContent = user.UserStatus;
        tdStatus.appendChild(spanStatus);
        row.appendChild(tdStatus);

        // COLUMNA: Acciones
        const tdActions = document.createElement("td");
        tdActions.classList.add("px-6", "py-4", "space-x-2");

        // Botón Editar
        const btnEdit = document.createElement("button");
        btnEdit.classList.add("text-blue-600", "hover:text-blue-800");
        btnEdit.textContent = "Editar";
        btnEdit.addEventListener("click", () => openEditModal(user.Id));
        tdActions.appendChild(btnEdit);

        // Botón Eliminar
        const btnDelete = document.createElement("button");
        btnDelete.classList.add("text-red-600", "hover:text-red-800");
        btnDelete.textContent = "Eliminar";
        btnDelete.addEventListener("click", () => deleteUser(user.Id));
        tdActions.appendChild(btnDelete);

        row.appendChild(tdActions);
        tbody.appendChild(row);
      });
    } catch (error) {
      console.error("Error al cargar usuarios:", error);
      alert("Hubo un problema al cargar los usuarios.");
    }
  }

  // Abre modal de edición y llena los campos con los datos actuales
  function openEditModal(userId) {
    const userRow = document.querySelector(`tr[data-id="${userId}"]`);
    if (!userRow) {
      alert("Usuario no encontrado.");
      return;
    }

    const fullName = userRow.querySelector(".user-name")?.textContent || "";
    const userRole = userRow.querySelector(".user-role")?.textContent || "";
    const userStatus = userRow.querySelector(".user-status")?.textContent || "";

    document.getElementById("editUserId").value = userId;
    document.getElementById("editFullName").value = fullName;
    document.getElementById("editUserRole").value = userRole;
    document.getElementById("editUserStatus").value = userStatus;

    document.getElementById("editUserModal").classList.remove("hidden");
    document.getElementById("editFullName").focus();
  }

  // Maneja la actualización del usuario mediante PUT
  document.getElementById("editUserForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const userId = document.getElementById("editUserId").value;
    const fullName = document.getElementById("editFullName").value.trim();
    const userRole = document.getElementById("editUserRole").value;
    const userStatus = document.getElementById("editUserStatus").value;

    if (!fullName || !userRole || !userStatus) {
      alert("Todos los campos son obligatorios.");
      return;
    }

    try {
      const response = await fetch(`http://localhost:3000/working-users/${userId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fullName, userRole, userStatus })
      });

      if (response.ok) {
        alert("Usuario actualizado exitosamente.");
        loadUsers(); // Recargar la lista
        document.getElementById("editUserModal").classList.add("hidden");
      } else {
        const error = await response.json();
        alert(`Error: ${error.message}`);
      }
    } catch (error) {
      console.error("Error al editar usuario:", error);
    }
  });

  // Función para eliminar un usuario mediante DELETE
  async function deleteUser(userId) {
    if (!confirm("¿Estás seguro de que deseas eliminar este usuario?")) return;

    try {
      const response = await fetch(`http://localhost:3000/working-users/${userId}`, {
        method: "DELETE"
      });

      if (response.ok) {
        alert("Usuario eliminado exitosamente.");
        loadUsers(); // Recargar la lista
      } else {
        const error = await response.json();
        alert(`Error: ${error.message}`);
      }
    } catch (error) {
      console.error("Error al eliminar usuario:", error);
    }
  }
</script>
</body>

</html>
