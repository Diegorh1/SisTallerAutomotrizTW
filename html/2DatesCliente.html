<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cliente - AutoCare Rodriguez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Puedes añadir estilos personalizados aquí si Tailwind no cubre algo */
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-gray-800 text-white px-6 py-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">AutoCare Rodriguez</h1>
            <div class="flex items-center space-x-4">
                 <a href="#upcoming-section">
                     <button class="px-4 py-2 rounded hover:bg-gray-700">Próximas Citas</button>
                 </a>
                 <a href="#history-section">
                     <button class="px-4 py-2 rounded hover:bg-gray-700">Historial</button>
                 </a>
                 <button id="open-schedule-modal-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                    Agendar Cita
                 </button>
                 </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <section id="upcoming-section" class="mb-8">
             <h2 class="text-3xl font-semibold text-gray-800 mb-6">Mis Próximas Citas</h2>
             <div id="upcoming-appointments-list" class="bg-white rounded-lg shadow p-6 space-y-4">
                <p id="loading-upcoming" class="text-gray-500">Cargando citas...</p>
                </div>
        </section>

        <section id="history-section" class="mb-8">
             <h2 class="text-3xl font-semibold text-gray-800 mb-6">Historial de Servicios</h2>
            <div id="service-history-list" class="bg-white rounded-lg shadow p-6 space-y-4">
                <p id="loading-history" class="text-gray-500">Cargando historial...</p>
                </div>
        </section>
    </div>

    <div id="scheduleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-2xl w-full">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-semibold">Agendar Nueva Cita</h3>
                <button id="close-schedule-modal-btn" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <form id="schedule-form" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="c-fecha" class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                        <input type="date" id="c-fecha" name="appointmentDate" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="c-hora" class="block text-sm font-medium text-gray-700 mb-1">Hora</label>
                        <input type="time" id="c-hora" name="appointmentTime" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label for="c-vehiculo" class="block text-sm font-medium text-gray-700 mb-1">Vehículo (Descripción)</label>
                    <input type="text" id="c-vehiculo" name="vehicleDescription" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Ej: Toyota Camry 2020 Azul">
                     </div>
                <div>
                    <label for="c-servicio" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Servicio</label>
                    <select id="c-servicio" name="serviceType" required class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Seleccione Servicio</option>
                        <option value="oil_change">Cambio de Aceite</option>
                        <option value="tire_rotation">Rotación de Llantas</option>
                        <option value="brake_service">Servicio de Frenos</option>
                        <option value="diagnostico">Diagnóstico General</option>
                        <option value="otro">Otro (detallar en notas)</option>
                        </select>
                </div>
                <div>
                    <label for="c-notas" class="block text-sm font-medium text-gray-700 mb-1">Notas Adicionales</label>
                    <textarea id="c-notas" name="notes" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500" rows="3" placeholder="Describe brevemente el problema o requerimiento..."></textarea>
                </div>
                <div id="schedule-form-feedback" class="text-red-600 text-sm mt-2"></div> <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-schedule-btn" class="px-6 py-2 border rounded-lg hover:bg-gray-100">Cancelar</button>
                    <button type="button" id="submit-schedule-btn" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Agendar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-gray-800 text-white py-6 px-6 mt-8">
        <div class="container mx-auto text-center">
            <p>&copy; <span id="current-year"></span> AutoCare Rodriguez. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Modal Handling ---
            const scheduleModal = document.getElementById('scheduleModal');
            const openModalBtn = document.getElementById('open-schedule-modal-btn');
            const closeModalBtn = document.getElementById('close-schedule-modal-btn');
            const cancelModalBtn = document.getElementById('cancel-schedule-btn');

            const showModal = () => scheduleModal.classList.remove('hidden');
            const hideModal = () => {
                 scheduleModal.classList.add('hidden');
                 document.getElementById('schedule-form').reset(); // Limpiar form al cerrar
                 document.getElementById('schedule-form-feedback').textContent = ''; // Limpiar feedback
            }

            openModalBtn.addEventListener('click', showModal);
            closeModalBtn.addEventListener('click', hideModal);
            cancelModalBtn.addEventListener('click', hideModal);

            // --- Footer Year ---
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // --- API Interaction Placeholder ---
            const scheduleForm = document.getElementById('schedule-form');
            const submitScheduleBtn = document.getElementById('submit-schedule-btn');
            const feedbackDiv = document.getElementById('schedule-form-feedback');

            // Función para cargar citas (llamaría a tu API GET /api/appointments)
            function loadAppointments() {
                const upcomingList = document.getElementById('upcoming-appointments-list');
                const historyList = document.getElementById('service-history-list');
                const loadingUpcoming = document.getElementById('loading-upcoming');
                const loadingHistory = document.getElementById('loading-history');

                // Simulación: Aquí harías fetch('/api/appointments') para obtener las citas del usuario
                console.log("Intentando cargar citas desde la API...");
                // fetch('/api/appointments') // Ruta de ejemplo para citas del usuario logueado
                //  .then(response => response.json())
                //  .then(data => {
                //      loadingUpcoming.style.display = 'none';
                //      loadingHistory.style.display = 'none';
                //      upcomingList.innerHTML = ''; // Limpiar antes de añadir
                //      historyList.innerHTML = ''; // Limpiar antes de añadir
                //      if (data.upcoming && data.upcoming.length > 0) {
                //          data.upcoming.forEach(renderAppointmentItem);
                //      } else {
                //          upcomingList.innerHTML = '<p class="text-gray-500">No tienes citas próximas.</p>';
                //      }
                //      if (data.history && data.history.length > 0) {
                //          data.history.forEach(renderHistoryItem);
                //      } else {
                //          historyList.innerHTML = '<p class="text-gray-500">No tienes historial de servicios.</p>';
                //      }
                //  })
                //  .catch(error => {
                //      console.error('Error cargando citas:', error);
                //      upcomingList.innerHTML = '<p class="text-red-500">Error al cargar citas.</p>';
                //      historyList.innerHTML = '<p class="text-red-500">Error al cargar historial.</p>';
                //  });

                // Mientras tanto, quitamos el "cargando" después de un tiempo (solo para demo)
                 setTimeout(() => {
                    if(loadingUpcoming) loadingUpcoming.style.display = 'none';
                    if(loadingHistory) loadingHistory.style.display = 'none';
                    // Añadir mensajes si no hay datos (simulado)
                    if (!upcomingList.querySelector('.appointment-item')) {
                         upcomingList.innerHTML = '<p class="text-gray-500">No tienes citas próximas.</p>';
                    }
                     if (!historyList.querySelector('.history-item')) {
                         historyList.innerHTML = '<p class="text-gray-500">No tienes historial de servicios.</p>';
                     }
                 }, 1500); // Simula carga
            }

             // Funciones para renderizar items (ejemplos, adaptar a tu estructura de datos)
             function renderAppointmentItem(appointment) {
                 const list = document.getElementById('upcoming-appointments-list');
                 const itemHTML = `
                    <div class="border rounded-lg p-4 appointment-item" data-appointment-id="${appointment.AppointmentID}">
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-medium appointment-datetime">${new Date(appointment.AppointmentDateTime).toLocaleString()}</span>
                            <span class="px-2 py-1 ${getStatusClass(appointment.Status)} rounded-full text-sm appointment-status">${appointment.Status}</span>
                        </div>
                        <p class="text-gray-600 mt-2 appointment-details">${appointment.ServiceType} - ${appointment.VehicleDescription}</p>
                        <div class="mt-3 flex space-x-2">
                            <button class="text-blue-600 hover:text-blue-800 text-sm modify-btn">Modificar</button>
                            <button class="text-red-600 hover:text-red-800 text-sm cancel-btn">Cancelar</button>
                        </div>
                    </div>`;
                 list.insertAdjacentHTML('beforeend', itemHTML);
             }

             function renderHistoryItem(appointment) {
                 const list = document.getElementById('service-history-list');
                  const itemHTML = `
                    <div class="border rounded-lg p-4 history-item" data-appointment-id="${appointment.AppointmentID}">
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-medium history-datetime">${new Date(appointment.AppointmentDateTime).toLocaleDateString()}</span>
                            <span class="px-2 py-1 ${getStatusClass(appointment.Status)} rounded-full text-sm history-status">${appointment.Status}</span>
                        </div>
                        <p class="text-gray-600 mt-2 history-details">${appointment.ServiceType} - ${appointment.VehicleDescription}</p>
                        <p class="text-sm text-gray-500 mt-2 history-notes">Notas: ${appointment.Notes || 'N/A'}</p>
                    </div>`;
                 list.insertAdjacentHTML('beforeend', itemHTML);
             }

             function getStatusClass(status) {
                 switch (status?.toLowerCase()) {
                     case 'pending': return 'bg-yellow-100 text-yellow-800';
                     case 'in_progress': return 'bg-blue-100 text-blue-800';
                     case 'completed': return 'bg-green-100 text-green-800';
                     case 'cancelled': return 'bg-red-100 text-red-800';
                     default: return 'bg-gray-100 text-gray-800';
                 }
             }


            // Listener para el botón de agendar (manejo de formulario con fetch)
            submitScheduleBtn.addEventListener('click', () => {
                feedbackDiv.textContent = ''; // Limpiar feedback previo
                const formData = new FormData(scheduleForm);
                const data = {
                    // Combina fecha y hora para AppointmentDateTime
                    appointmentDateTime: `${formData.get('appointmentDate')}T${formData.get('appointmentTime')}:00`,
                    vehicleDescription: formData.get('vehicleDescription'),
                    serviceType: formData.get('serviceType'),
                    notes: formData.get('notes') || null // Enviar null si está vacío
                };

                // Validación básica de cliente
                if (!data.appointmentDateTime.includes('T') || !data.vehicleDescription || !data.serviceType) {
                    feedbackDiv.textContent = 'Por favor, complete todos los campos requeridos (Fecha, Hora, Vehículo, Servicio).';
                    return;
                }

                console.log('Enviando datos a la API:', data);
                 submitScheduleBtn.disabled = true; // Deshabilitar botón mientras se envía
                 submitScheduleBtn.textContent = 'Agendando...';

                // Aquí harías la llamada POST a tu API
                // fetch('/api/appointments', {
                //     method: 'POST',
                //     headers: {
                //         'Content-Type': 'application/json',
                //         // Aquí iría el token de autenticación si es necesario
                //         // 'Authorization': `Bearer ${your_auth_token}`
                //     },
                //     body: JSON.stringify(data)
                // })
                // .then(response => {
                //     if (!response.ok) {
                //         // Si la API devuelve un error, intenta leer el mensaje
                //         return response.json().then(err => { throw new Error(err.message || 'Error al agendar cita') });
                //     }
                //     return response.json();
                // })
                // .then(newAppointment => {
                //     console.log('Cita agendada:', newAppointment);
                //     hideModal(); // Cerrar modal si fue exitoso
                //     loadAppointments(); // Recargar la lista de citas
                //     // Podrías mostrar un mensaje de éxito global
                // })
                // .catch(error => {
                //     console.error('Error en el formulario:', error);
                //     feedbackDiv.textContent = `Error: ${error.message}`;
                // })
                // .finally(() => {
                //      submitScheduleBtn.disabled = false; // Rehabilitar botón
                //      submitScheduleBtn.textContent = 'Agendar';
                // });

                 // Simulación de éxito después de 1 segundo
                 setTimeout(() => {
                     console.log('Simulación: Cita agendada');
                     hideModal();
                     loadAppointments(); // Simula recarga
                     alert('¡Cita agendada con éxito! (Simulación)'); // Mensaje simple de éxito
                     submitScheduleBtn.disabled = false;
                     submitScheduleBtn.textContent = 'Agendar';
                 }, 1000);
            });

            // Cargar citas iniciales al cargar la página
            loadAppointments();

             // Placeholder para listeners de botones Modificar/Cancelar (requieren API)
             document.getElementById('upcoming-appointments-list').addEventListener('click', (event) => {
                 if (event.target.classList.contains('modify-btn')) {
                     const appointmentId = event.target.closest('.appointment-item').dataset.appointmentId;
                     console.log(`Modificar cita ID: ${appointmentId} (Implementar lógica y modal de modificación)`);
                     alert(`Funcionalidad Modificar para ID ${appointmentId} no implementada.`);
                 } else if (event.target.classList.contains('cancel-btn')) {
                     const appointmentId = event.target.closest('.appointment-item').dataset.appointmentId;
                     console.log(`Cancelar cita ID: ${appointmentId}`);
                     if (confirm(`¿Está seguro que desea cancelar la cita ID ${appointmentId}?`)) {
                         // Aquí harías fetch('/api/appointments/' + appointmentId, { method: 'DELETE' or 'PATCH' para cambiar status a 'cancelled' })
                         console.log(`Llamada API para cancelar cita ID: ${appointmentId}`);
                         alert(`Funcionalidad Cancelar para ID ${appointmentId} no implementada (API Call pendiente).`);
                         // .then(() => loadAppointments()); // Recargar lista después de cancelar
                     }
                 }
             });
        });
    </script>

</body>
</html>
