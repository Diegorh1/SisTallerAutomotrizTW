<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Workshop Rodriguez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <nav class="bg-gray-800 text-white px-6 py-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">AutoCare Rodriguez2</h1>
            <div class="flex space-x-4">
                <a href="index.html">
                    <button class="px-4 py-2 rounded hover:bg-gray-700">Clients</button>
                </a>                  
                <a href="html/2Dates.html"><button class="px-4 py-2 rounded hover:bg-gray-700">Appointments</button></a>
                <a href="html/3.1SegService.html"><button class="px-4 py-2 rounded hover:bg-gray-700">SegService</button></a>
                <a href="html/4Inventory.html"><button class="px-4 py-2 rounded hover:bg-gray-700">Inventory</button></a>
                <a href="html/5Billing.html"><button class="px-4 py-2 rounded hover:bg-gray-700">Billing</button></a>
                <a href="html/7Users.html">
                    <button class="px-4 py-2 rounded hover:bg-gray-700">Users</button>
                </a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-semibold text-gray-800">Client Management</h2>
            <button class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors" onclick="document.getElementById('addClientModal').classList.remove('hidden')">Add New Client</button>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <input type="text" placeholder="Search clients..." class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <select class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">All Brands</option>
                    
                    

                </select>
                <button class="px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">Clear</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Client Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Vehicle Details</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4">John Doe</td>
                            <td class="px-6 py-4">Toyota Camry 2020</td>
                            <td class="px-6 py-4">john@example.com</td>
                            <td class="px-6 py-4">
                                <button class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
                                <button class="text-red-600 hover:text-red-800">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Client Modal -->
        <div id="addClientModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
            <div class="bg-white rounded-lg p-8 max-w-2xl w-full">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-semibold">Add New Client</h3>
                    <button onclick="document.getElementById('addClientModal').classList.add('hidden')" class="text-gray-500 hover:text-gray-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <form class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input type="tel" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Vehicle Brand</label>
                        <select class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">All Brands</option>
                            

                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">License Plate</label>
                        <input type="text" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button" onclick="document.getElementById('addClientModal').classList.add('hidden')" class="px-6 py-2 border rounded-lg hover:bg-gray-100">Cancel</button>
                        <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-6 px-6 mt-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 AutoCare Rodriguez. All rights reserved.</p>
        </div>
    </footer>
    <script> 
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/clients') // Llamada al backend para obtener los clientes
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Error HTTP! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const tableBody = document.querySelector('tbody');
                    tableBody.innerHTML = ''; // Limpia la tabla antes de llenarla
                    data.forEach(client => {
                        const row = `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4">${client.name}</td>
                                <td class="px-6 py-4">${client.vehicle}</td>
                                <td class="px-6 py-4">${client.contact}</td>
                                <td class="px-6 py-4">
                                    <button class="text-blue-600 hover:text-blue-800 mr-3" onclick="editClient(${client.id})">Edit</button>
                                    <button class="text-red-600 hover:text-red-800" onclick="deleteClient(${client.id})">Delete</button>
                                </td>
                            </tr>
                        `;
                        tableBody.insertAdjacentHTML('beforeend', row);
                    });
                })
                .catch(error => {
                    console.error('Error al obtener clientes:', error);
                });
        });
        
        function editClient(id) {
            // Lógica para editar un cliente
            console.log(`Edit client with ID: ${id}`);
        }
        
        function deleteClient(id) {
            fetch(`/clients/${id}`, { method: 'DELETE' })
                .then(() => {
                    alert('Cliente eliminado');
                    location.reload();
                })
                .catch(error => {
                    console.error('Error al eliminar cliente:', error);
                });
        }
        
    </script>
</body>
</html>
