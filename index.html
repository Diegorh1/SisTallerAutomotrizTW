</head>
<body class="bg-gray-50">

                <div class="flex space-x-4">
                    <a href="index.html">

                    <a href="/html/2Dates.html"><button class="px-4 py-2 rounded hover:bg-gray-700">Appointments</button></a>
                    <a href="/html/3.1SegService.html"><button class="px-4 py-2 rounded hover:bg-gray-700">SegService</button></a>
                    <a href="/html/4Inventory.html"><button class="px-4 py-2 rounded hover:bg-gray-700">Inventory</button></a>

                    <a href="/html/7Users.html">

      <!-- Botón "Agregar Nuevo Usuario" -->
      <div class="flex justify-between items-center mb-6 mt-6">
        <button aria-label="Add New User" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700"
          onclick="document.getElementById('addUserModal').classList.remove('hidden')">
          Agregar Nuevo Usuario
        </button>
      </div>

      <!-- Tabla de usuarios -->
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Nombre</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Email</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Teléfono</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Información </th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <!-- Las filas generadas dinámicamente aparecerán aquí -->
          </tbody>
        </table>
      </div>

      <!-- Modal: Agregar Nuevo Usuario -->
      <div id="addUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-8 max-w-md w-full shadow-md">
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-semibold text-gray-800">Agregar Nuevo Usuario</h3>
            <button onclick="document.getElementById('addUserModal').classList.add('hidden')" 
                    class="text-gray-600 hover:text-gray-800">
              ✕
            </button>
          </div>

          <!-- Formulario para agregar usuario -->
          <form id="addUserForm" class="space-y-4">
            <div>
              <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
              <input type="text" id="fullName" name="fullName" placeholder="Nombre Completo" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
              <input type="email" id="email" name="email" placeholder="Correo Electrónico" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
              <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
              <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Teléfono" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Información</label>
              <textarea id="notes" name="notes" placeholder="Notas sobre el usuario" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 h-24 resize-y"></textarea>
            </div>
            <div>
              <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
              <input type="password" id="password" name="password" placeholder="Contraseña" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
              <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmar Contraseña" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="flex justify-end space-x-4 mt-6">
              <button type="button" 
                      onclick="document.getElementById('addUserModal').classList.add('hidden')" 
                      class="px-4 py-2 border rounded-lg hover:bg-gray-100">
                Cancelar
              </button>
              <button type="submit" 
                      class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 focus:outline-none">
                Guardar
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Modal para Editar Usuario -->
      <div id="editUserModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-8 max-w-md w-full shadow-md">
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-semibold text-gray-800">Editar Usuario</h3>
            <button onclick="document.getElementById('editUserModal').classList.add('hidden')" 
                    aria-label="Cerrar modal" 
                    class="text-gray-600 hover:text-gray-800">
              ✕
            </button>
          </div>
          <form id="editUserForm" class="space-y-4">
            <input type="hidden" id="editUserId">
            <div>
              <label for="editFullName" class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
              <input type="text" id="editFullName" name="editFullName" placeholder="Nombre Completo" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
              <label for="editEmail" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
              <input type="email" id="editEmail" name="editEmail" placeholder="Correo Electrónico" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
              <label for="editPhoneNumber" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
              <input type="tel" id="editPhoneNumber" name="editPhoneNumber" placeholder="Teléfono" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label for="editNotes" class="block text-sm font-medium text-gray-700 mb-1">Información </label>
              <textarea id="editNotes" name="editNotes" placeholder="Notas sobre el usuario" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 h-24 resize-y"></textarea>
            </div>
            <div>
              <label for="editPassword" class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña (dejar en blanco para mantener la actual)</label>
              <input type="password" id="editPassword" name="editPassword" placeholder="Nueva Contraseña" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label for="editConfirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Nueva Contraseña</label>
              <input type="password" id="editConfirmPassword" name="editConfirmPassword" placeholder="Confirmar Nueva Contraseña" 
                     class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-end space-x-4 mt-6">
              <button type="button" 
                      onclick="document.getElementById('editUserModal').classList.add('hidden')" 
                      class="px-4 py-2 border rounded-lg hover:bg-gray-100">
                Cancelar
              </button>
              <button type="submit" 
                      class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 focus:outline-none">
                Guardar
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
// Función para cargar usuarios desde el backend
async function loadUsers() {
  try {
    const response = await fetch("http://localhost:3000/users");
    if (!response.ok) {
      throw new Error(`Error al obtener los usuarios: ${response.status}`);
    }

    const users = await response.json();
    const tbody = document.querySelector("tbody");
    // Limpia el contenido previo
    tbody.innerHTML = "";

    if (users.length === 0) {
      const trEmpty = document.createElement("tr");
      const tdEmpty = document.createElement("td");
      tdEmpty.setAttribute("colspan", "5");
      tdEmpty.classList.add("text-center", "py-4", "text-gray-600");
      tdEmpty.textContent = "No hay usuarios disponibles.";
      trEmpty.appendChild(tdEmpty);
      tbody.appendChild(trEmpty);
      return;
    }

    users.forEach((user) => {
      const row = document.createElement("tr");
      row.classList.add("hover:bg-gray-50");
      row.setAttribute("data-id", user.ID);

      // COLUMNA: Nombre Completo
      const tdName = document.createElement("td");
      tdName.classList.add("px-6", "py-4", "text-gray-800", "user-name");
      tdName.textContent = user.FullName;
      row.appendChild(tdName);

      // COLUMNA: Email
      const tdEmail = document.createElement("td");
      tdEmail.classList.add("px-6", "py-4", "text-gray-800", "user-email");
      tdEmail.textContent = user.Email;
      row.appendChild(tdEmail);

      // COLUMNA: Teléfono
      const tdPhone = document.createElement("td");
      tdPhone.classList.add("px-6", "py-4", "text-gray-800", "user-phone");
      tdPhone.textContent = user.PhoneNumber || "N/A";
      row.appendChild(tdPhone);

      // COLUMNA: Notas (obteniendo la primera nota si existe)
      const tdNotes = document.createElement("td");
      tdNotes.classList.add("px-6", "py-4", "text-gray-800", "user-notes");
      tdNotes.textContent = user.notes && user.notes.length > 0 ? user.notes[0].Note : "-Agregar Información-";
      row.appendChild(tdNotes);

      // COLUMNA: Acciones
      const tdActions = document.createElement("td");
      tdActions.classList.add("px-6", "py-4", "space-x-2");

      // Botón Editar
      const btnEdit = document.createElement("button");
      btnEdit.classList.add("text-blue-600", "hover:text-blue-800");
      btnEdit.textContent = "Editar";
      btnEdit.addEventListener("click", () => openEditModal(user.ID));
      tdActions.appendChild(btnEdit);

      // Botón Eliminar
      const btnDelete = document.createElement("button");
      btnDelete.classList.add("text-red-600", "hover:text-red-800", "ml-4");
      btnDelete.textContent = "Eliminar";
      btnDelete.addEventListener("click", () => deleteUser(user.ID));
      tdActions.appendChild(btnDelete);

      row.appendChild(tdActions);
      tbody.appendChild(row);
    });
  } catch (error) {
    console.error("Error al cargar usuarios:", error);
    showNotification("Hubo un problema al cargar los usuarios.", "error");
  }
}

// Función para mostrar notificaciones
function showNotification(message, type = "info") {
  // Aquí podrías implementar un sistema de notificaciones más elegante
  // En lugar de usar alert() directamente
  if (type === "error") {
    console.error(message);
  }
  alert(message);
}

// Abre modal de edición y llena los campos con los datos actuales
async function openEditModal(userId) {
  try {
    if (!userId) {
      throw new Error("ID de usuario no válido");
    }
    
    const response = await fetch(`http://localhost:3000/users/${userId}`);
    if (!response.ok) {
      throw new Error(`Error al obtener los datos del usuario: ${response.status}`);
    }

    const user = await response.json();

    document.getElementById("editUserId").value = user.ID;
    document.getElementById("editFullName").value = user.FullName || "";
    document.getElementById("editEmail").value = user.Email || "";
    document.getElementById("editPhoneNumber").value = user.PhoneNumber || "";
    
    // Obtener la nota más reciente (primera del array)
    document.getElementById("editNotes").value = user.notes && user.notes.length > 0 
      ? user.notes[0].Note 
      : "";
      
    document.getElementById("editPassword").value = "";
    document.getElementById("editConfirmPassword").value = "";

    document.getElementById("editUserModal").classList.remove("hidden");
    document.getElementById("editFullName").focus();
  } catch (error) {
    console.error("Error al obtener datos del usuario:", error);
    showNotification("Hubo un problema al cargar los datos del usuario.", "error");
  }
}

// Función para validar email
function validateEmail(email) {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return emailRegex.test(email);
}

// Maneja el envío del formulario para agregar un nuevo usuario
document.getElementById("addUserForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  // Obtener valores del formulario
  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const phoneNumber = document.getElementById("phoneNumber").value.trim();
  const note = document.getElementById("notes").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  // Validar campos obligatorios
  if (!fullName || !email || !password) {
    showNotification("Nombre, email y contraseña son obligatorios.", "error");
    return;
  }

  // Validar formato de email
  if (!validateEmail(email)) {
    showNotification("Por favor ingrese un correo electrónico válido.", "error");
    return;
  }

  // Validar que las contraseñas coincidan
  if (password !== confirmPassword) {
    showNotification("Las contraseñas no coinciden.", "error");
    return;
  }

  // Mostrar indicador de carga
  const submitButton = document.querySelector("#addUserForm button[type='submit']");
  const originalButtonText = submitButton.textContent;
  submitButton.textContent = "Guardando...";
  submitButton.disabled = true;

  try {
    const userData = {
      fullName: fullName,
      email: email,
      phoneNumber: phoneNumber || null,
      password: password,
      note: note || null
    };

    // Crear el usuario con una sola solicitud incluyendo la nota
    const response = await fetch("http://localhost:3000/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(userData),
    });

    if (!response.ok) {
      const result = await response.json();
      throw new Error(result.message || `Error del servidor: ${response.status}`);
    }

    await response.json();
    
    showNotification("Usuario creado exitosamente.");
    document.getElementById("addUserModal").classList.add("hidden");
    document.getElementById("addUserForm").reset();
    await loadUsers(); // Recargar la lista de usuarios
  } catch (error) {
    console.error("Error al crear usuario:", error);
    showNotification(`Error: ${error.message || "Hubo un problema al crear el usuario."}`, "error");
  } finally {
    // Restaurar el botón
    submitButton.textContent = originalButtonText;
    submitButton.disabled = false;
  }
});

// Maneja la actualización del usuario
document.getElementById("editUserForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  // Obtener valores del formulario
  const userId = document.getElementById("editUserId").value;
  const fullName = document.getElementById("editFullName").value.trim();
  const email = document.getElementById("editEmail").value.trim();
  const phoneNumber = document.getElementById("editPhoneNumber").value.trim();
  const note = document.getElementById("editNotes").value.trim();
  const password = document.getElementById("editPassword").value;
  const confirmPassword = document.getElementById("editConfirmPassword").value;

  // Validar campos obligatorios
  if (!fullName || !email) {
    showNotification("Nombre y email son obligatorios.", "error");
    return;
  }

  // Validar formato de email
  if (!validateEmail(email)) {
    showNotification("Por favor ingrese un correo electrónico válido.", "error");
    return;
  }

  // Validar que las contraseñas coincidan si se está actualizando la contraseña
  if (password && password !== confirmPassword) {
    showNotification("Las contraseñas no coinciden.", "error");
    return;
  }

  // Preparar datos para enviar
  const userData = { 
    fullName: fullName, 
    email: email, 
    phoneNumber: phoneNumber || null,
    note: note
  };
  
  if (password) {
    userData.password = password;
  }

  // Mostrar indicador de carga
  const submitButton = document.querySelector("#editUserForm button[type='submit']");
  const originalButtonText = submitButton.textContent;
  submitButton.textContent = "Guardando...";
  submitButton.disabled = true;

  try {
    // Actualizar usuario
    const response = await fetch(`http://localhost:3000/users/${userId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(userData),
    });

    if (!response.ok) {
      const result = await response.json();
      throw new Error(result.message || `Error del servidor: ${response.status}`);
    }

    showNotification("Usuario actualizado exitosamente.");
    document.getElementById("editUserModal").classList.add("hidden");
    await loadUsers(); // Recargar la lista de usuarios
  } catch (error) {
    console.error("Error al actualizar usuario:", error);
    showNotification(`Error: ${error.message || "Hubo un problema al actualizar el usuario."}`, "error");
  } finally {
    // Restaurar el botón
    submitButton.textContent = originalButtonText;
    submitButton.disabled = false;
  }
});

// Función para eliminar un usuario
async function deleteUser(userId) {
  if (!confirm("¿Estás seguro de que deseas eliminar este usuario?")) return;

  try {
    const response = await fetch(`http://localhost:3000/users/${userId}`, {
      method: "DELETE",
    });

    if (response.ok) {
      showNotification("Usuario eliminado exitosamente.");
      await loadUsers(); // Recargar la lista
    } else {
      const error = await response.json();
      showNotification(`Error: ${error.message || "No se pudo eliminar el usuario"}`, "error");
    }
  } catch (error) {
    console.error("Error al eliminar usuario:", error);
    showNotification("Hubo un problema al eliminar el usuario.", "error");
  }
}

// Cerrar modales cuando se hace clic en el botón de cerrar o fuera del modal
document.querySelectorAll(".modal-close, .modal-cancel").forEach(element => {
  element.addEventListener("click", function() {
    document.querySelectorAll(".modal").forEach(modal => {
      modal.classList.add("hidden");
    });
  });
});

// Cargar usuarios al iniciar la página
document.addEventListener("DOMContentLoaded", loadUsers);
  </script>
</body>
